apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.11.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              sed -e "s|__ES_ENDPOINT__|$ES_ENDPOINT|g" \
                  -e "s|__ES_API_KEY__|$ES_API_KEY|g" \
                  -e "s|__SCRAPE_JOB_NAME__|$SCRAPE_JOB_NAME|g" \
                  -e "s|__APP_TARGET__|$APP_TARGET|g" \
                  -e "s|__SCRAPE_INTERVAL__|$PROMETHEUS_SCRAPE_INTERVAL|g" \
                  /etc/prometheus/prometheus.yml.tmpl > /tmp/prometheus.yml && \
              exec /bin/prometheus \
                --config.file=/tmp/prometheus.yml \
                --storage.tsdb.path=/prometheus \
                --web.console.libraries=/usr/share/prometheus/console_libraries \
                --web.console.templates=/usr/share/prometheus/consoles
          ports:
            - name: web
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: demo-shared-config
            - secretRef:
                name: elastic-credentials
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: storage
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
